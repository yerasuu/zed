# Hand-written (not generated by `cargo xtask workflows`), so the generator leaves it alone.
# Daily trial merge of upstream `main` into this fork's `main`, so conflicts and breakage surface
# within a day instead of piling up. It never pushes; a human performs the real merge.
name: fleet_upstream_sync
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fleet_upstream_sync
  cancel-in-progress: true
jobs:
  trial_merge:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "fleet-sync"
          git config user.email "fleet-sync@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch --no-tags upstream main
          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge conflicts with upstream/main:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: List fleet hooks in upstream files
        run: git grep -n "// fleet:" -- crates || true
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Check fleet-touched crates
        run: cargo check -p project -p agent_servers -p agent_ui -p settings_content
      - name: Test fleet-touched crates
        run: cargo test -p project agent_accounts
      - name: Test fleet agent_ui code
        run: cargo test -p agent_ui --lib fleet_accounts
